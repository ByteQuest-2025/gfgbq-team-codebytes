<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background with blue-to-green gradient -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#gradient)"/>
  <!-- Location pin icon (white outline) -->
  <g transform="translate(32, 22)">
    <!-- Pin head (circle) -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Inner square in the circle head -->
    <rect x="-3.5" y="-3.5" width="7" height="7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Pin tail (pointed bottom) -->
    <path d="M 0 9 L -5 22 L 0 19 L 5 22 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>

